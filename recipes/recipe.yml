---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-bootc-os
description: This is my personal OS image.

base-image: quay.io/fedora/fedora-bootc
image-version: latest

modules:
   # Copy system files (including systemd units for bootc updates)
  - type: files
    files:
      - source: system
        destination: /

  # Install GNOME desktop, remove GNOME Software
  - type: dnf
    group-install:
      packages:
        - gnome-desktop
    remove:
      packages:
        - gnome-software

  # Set up repositories (RPM Fusion for Codecs & VS Code)
  - type: dnf
    repos:
      nonfree: rpmfusion
      files:
        - https://packages.microsoft.com/yumrepos/vscode/vscode.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc

  # Install additional packages
  - type: dnf
    install:
      packages:
        - firefox
        - chezmoi

  # Install Homebrew with daily auto-updates
  - type: brew
    auto-update: true
    auto-upgrade: true
    update-interval: "1d"
    upgrade-interval: "1d"

  # Install default flatpaks from Flathub
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          title: Flathub
        install:
          - io.github.kolunmi.Bazaar # Bazaar
          - org.gnome.Firmware # Firmware

  # Enable automatic updates for Flatpaks and bootc
  - type: systemd
    system:
      enabled:
        - flatpak-system-update.timer
        - bootc-update.timer
        - podman.socket
    user:
      enabled:
        - flatpak-user-update.timer

  # Set up signing for secure image verification
  - type: signing

---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Silverblue ships with GNOME. Remove bundled apps we don't want
  - type: dnf
    remove:
      packages:
        - gnome-software
        - yelp
        - malcontent-control
        - gnome-tour
        - gnome-user-docs
        - gnome-user-share
        - gnome-remote-desktop
        - rygel
        - gnome-classic-session
        - gnome-system-monitor
  # Install GNOME Flatpaks or their replacements that we want from Flathub (what Silverblue's installer preinstalls from Fedora's remote)
  # No GNOME Flatpak will be installed otherwise, as Fedora Flatpak remote is masked
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          name: flathub
          title: Flathub
        install:
          - org.gnome.baobab # Disk Usage Analyzer
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Decibels
          - org.gnome.Contacts
          - org.gnome.font-viewer
          - org.gnome.TextEditor
          - org.gnome.Loupe # Image viewer
          - org.gnome.Logs
          - org.gnome.NautilusPreviewer
          - org.gnome.Papers
  - type: gnome-extensions
    install:
      - Blur my Shell
      - AppIndicator and KStatusNotifierItem Support
      - Night Theme Switcher
      - Bluetooth Battery Monitor
      - GSConnect
      - Caffeine
    uninstall:
      - Apps Menu
      - Background Logo
      - Launch New Instance
      - Places Status Indicator
      - 602 # Window List
      # 602 = the built-in Window List; the name alone also matches a
      # third-party extension on extensions.gnome.org and breaks the module
